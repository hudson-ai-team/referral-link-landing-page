<!DOCTYPE html>
<html lang="en">

<head>
  <script src="https://widget.partner.io/partnerLink.js"></script>
  <script>
    window.partnerLinkLibrary.init();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner.io | Scale Your Business</title>
  <meta name="description"
    content="Join the partner network that helps you scale your business through referral tracking and automation.">
  <link rel="stylesheet" href="style.css">
  <!-- Tracking Script -->
  <script data-site-id="site_c0uydxbbmmevu485" src="https://www.measured.site/js/script.js"
    data-api-url="https://www.measured.site/api/session" defer></script>
</head>

<body>
  <script src="https://js-eu1.hsforms.net/forms/embed/developer/145620171.js" defer></script>
  <div class="hs-form-html" data-region="eu1" data-form-id="b5184a88-3119-4a08-abd4-6ee9acae9e31"
    data-portal-id="145620171"></div>
  <script>
    let _hsFormsV4 = null;
    let _pendingInject = false;

    function injectPlid() {
      if (!_hsFormsV4) return;
      if (!window.partnerLinkLibrary || typeof window.partnerLinkLibrary.getPlid !== 'function') {
        console.warn('[partner.io] getPlid not available');
        return;
      }
      const hsForms = _hsFormsV4.getForms();
      if (!hsForms || hsForms.length === 0) {
        console.warn('[partner.io] No HubSpot forms registered yet');
        return;
      }
      const plidValue = window.partnerLinkLibrary.getPlid();
      hsForms[0].setFieldValue('0-1/temp_pio_plid', plidValue);
      console.log('[partner.io] PLID set via HubSpotFormsV4:', plidValue);
      _pendingInject = false;
    }

    // Intercept the moment HubSpot assigns window.HubSpotFormsV4
    Object.defineProperty(window, 'HubSpotFormsV4', {
      get() { return _hsFormsV4; },
      set(value) {
        _hsFormsV4 = value;
        console.log('[partner.io] HubSpotFormsV4 became available');
        if (_pendingInject) injectPlid();
      },
      configurable: true,
    });

    const observer = new MutationObserver(function (mutations, obs) {
      const form = document.querySelector('form');
      if (form) {
        console.log('[partner.io] Form detected, injecting PLID and attaching submit listener');
        obs.disconnect();

        if (_hsFormsV4) {
          injectPlid();
        } else {
          // Library not ready yet — flag so the setter above fires injectPlid when it arrives
          _pendingInject = true;
          console.log('[partner.io] Waiting for HubSpotFormsV4...');
        }

        form.addEventListener('submit', function () {
          injectPlid();
          console.log('[partner.io] Form submitted, recording sign-up event');
          const data = window.partnerLinkLibrary.getSignUpDataFromFormElement(form);
          window.partnerLinkLibrary.recordSignUpEvent(data);
        });
      }
    });

    observer.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
