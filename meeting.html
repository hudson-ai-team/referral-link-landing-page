<!DOCTYPE html>
<html lang="en">

<head>
    <script src="https://widget.partner.io/partnerLink.js"></script>
<script>
  window.partnerLinkLibrary.init();
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner.io | Scale Your Business</title>
    <meta name="description"
        content="Join the partner network that helps you scale your business through referral tracking and automation.">
    <link rel="stylesheet" href="style.css">
    <!-- Tracking Script -->
    <script data-site-id="site_c0uydxbbmmevu485" src="https://www.measured.site/js/script.js"
        data-api-url="https://www.measured.site/api/session" defer></script>
</head>
<body>
<script src="https://js-eu1.hsforms.net/forms/embed/developer/145620171.js" defer></script>
<div class="hs-form-html" data-region="eu1" data-form-id="b5184a88-3119-4a08-abd4-6ee9acae9e31" data-portal-id="145620171"></div>
<script>
  // 1. Listen for HubSpot's global "onFormReady" message event to inject the value early
window.addEventListener('message', function(event) {
  if (event.data.type === 'hsFormCallback' && event.data.eventName === 'onFormReady') {
    
    // Find the specific form that just loaded using its ID
    const form = document.querySelector(`[data-form-id="${event.data.id}"]`);
    if (!form) return;

    // Use a wildcard selector (name*=) because HubSpot dynamically prefixes field names (e.g., "0-1/temp_pio_plid")
    const plidField = form.querySelector('input[name*="temp_pio_plid"]');
    
    if (plidField && window.partnerLinkLibrary && typeof window.partnerLinkLibrary.getPlid === 'function') {
      const plidValue = window.partnerLinkLibrary.getPlid();
      
      // Inject value cleanly into React state BEFORE submission
      plidField.value = plidValue;
      plidField.dispatchEvent(new Event('input', { bubbles: true }));
      plidField.dispatchEvent(new Event('change', { bubbles: true }));
      
      console.log('[partner.io] PLID injected into HubSpot state on form load:', plidValue);
    } else {
      console.warn('[partner.io] Could not inject PLID on load — field found:', !!plidField);
    }
  }
});

// 2. Keep your MutationObserver solely for attaching your custom tracking listener on submission
const observer = new MutationObserver(function(mutations, obs) {
  const form = document.querySelector('form');
  if (form) {
    console.log('[partner.io] Form found, attaching tracking listener:', form);
    
    form.addEventListener('submit', function(event) {
      console.log('[partner.io] Form submitted, recording sign-up event');
      
      // We no longer inject the PLID value here because the window listener above already handled it.
      // Simply extract your sign-up data and record the event.
      const data = window.partnerLinkLibrary.getSignUpDataFromFormElement(form);
      window.partnerLinkLibrary.recordSignUpEvent(data);
    });
    
    obs.disconnect();
    console.log('[partner.io] Tracking listener attached successfully');
  }
});

// Start monitoring the DOM for the form element
observer.observe(document.body, { childList: true, subtree: true });
</script>
</body>
