<body>
<script src="https://js-eu1.hsforms.net/forms/embed/developer/145620171.js" defer></script>
<div class="hs-form-html" data-region="eu1" data-form-id="b5184a88-3119-4a08-abd4-6ee9acae9e31" data-portal-id="145620171"></div>
<script>
  console.log('[partner.io] Waiting for HubSpot form to appear in DOM...');

  const observer = new MutationObserver(function(mutations, obs) {
    const form = document.querySelector('form');
    if (form) {
      console.log('[partner.io] Form found, attaching submit listener:', form);
      form.addEventListener('submit', function(event) {
        console.log('[partner.io] Form submitted, recording sign-up event');
        debugger;
        const plidField = form.querySelector('input[name="0-1/temp_pio_plid"]');
        if (plidField && window.partnerLinkLibrary && typeof window.partnerLinkLibrary.getPlid === 'function') {
          plidField.value = window.partnerLinkLibrary.getPlid();
          console.log('[partner.io] temp_pio_plid set to:', plidField.value);
        } else {
          console.warn('[partner.io] Could not set temp_pio_plid — field found:', !!plidField, '| getPlid available:', !!(window.partnerLinkLibrary && typeof window.partnerLinkLibrary.getPlid === 'function'));
        }
        const data = window.partnerLinkLibrary.getSignUpDataFromFormElement(form);
        window.partnerLinkLibrary.recordSignUpEvent(data);
      });
      obs.disconnect();
      console.log('[partner.io] Submit listener attached successfully');
    }
  });

  observer.observe(document.body, { childList: true, subtree: true });
</script>
</body>
