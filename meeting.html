<!DOCTYPE html>
<html lang="en">

<head>
  <script src="https://widget.partner.io/partnerLink.js"></script>
  <script>
    window.partnerLinkLibrary.init();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner.io | Scale Your Business</title>
  <meta name="description"
    content="Join the partner network that helps you scale your business through referral tracking and automation.">
  <link rel="stylesheet" href="style.css">
  <!-- Tracking Script -->
  <script data-site-id="site_c0uydxbbmmevu485" src="https://www.measured.site/js/script.js"
    data-api-url="https://www.measured.site/api/session" defer></script>
</head>

<body>
  <script src="https://js-eu1.hsforms.net/forms/embed/developer/145620171.js" defer></script>
  <div class="hs-form-html" data-region="eu1" data-form-id="b5184a88-3119-4a08-abd4-6ee9acae9e31"
    data-portal-id="145620171"></div>
  <script>
    // 1. Listen for HubSpot's global form ready event to update internal state safely
    window.addEventListener('message', function (event) {
      console.log(event);
      if (event.data.type === 'hsFormCallback' && event.data.eventName === 'onFormReady') {

        if (window.partnerLinkLibrary && typeof window.partnerLinkLibrary.getPlid === 'function') {
          const plidValue = window.partnerLinkLibrary.getPlid();
          const fieldName = 'temp_pio_plid';

          // OPTION A: The Modern HubSpot v4 Way (Bypasses React DOM tracking entirely)
          if (window.HubSpotFormsV4) {
            try {
              const hsForms = window.HubSpotFormsV4.getForms();
              if (hsForms && hsForms.length > 0) {
                // HubSpot uses '0-1/fieldName' for its internal state dictionary
                hsForms[0].setFieldValue(`0-1/${fieldName}`, plidValue);
                console.log('[partner.io] PLID successfully injected via HubSpotFormsV4 API:', plidValue);
                return; // Exit if modern method succeeds
              }
            } catch (err) {
              console.warn('[partner.io] Failed updating via HubSpotFormsV4 API, falling back to DOM:', err);
            }
          }

          // OPTION B: Bulletproof DOM Fallback (If v4 global object is isolated)
          const form = document.querySelector(`[data-form-id="${event.data.id}"]`);
          if (form) {
            const plidField = form.querySelector(`input[name*="${fieldName}"]`);
            if (plidField) {
              plidField.value = plidValue;

              // Dispatch a React-compatible native event simulation
              const nativeInputValueSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value").set;
              nativeInputValueSetter.call(plidField, plidValue);

              plidField.dispatchEvent(new Event('input', { bubbles: true }));
              plidField.dispatchEvent(new Event('change', { bubbles: true }));
              console.log('[partner.io] PLID injected via native React tracker fallback:', plidValue);
            }
          }
        } else {
          console.warn('[partner.io] partnerLinkLibrary or getPlid was not available during form load.');
        }
      }
    });

    // 2. Your MutationObserver purely focused on capturing the submitted tracking payload
    const observer = new MutationObserver(function (mutations, obs) {
      const form = document.querySelector('form');
      if (form) {
        console.log('[partner.io] Form found, attaching sign-up tracking listener');

        form.addEventListener('submit', function (event) {
          console.log('[partner.io] Form submitted, recording sign-up event');
          const data = window.partnerLinkLibrary.getSignUpDataFromFormElement(form);
          window.partnerLinkLibrary.recordSignUpEvent(data);
        });

        obs.disconnect();
        console.log('[partner.io] Tracking listener attached successfully');
      }
    });

    // Start tracking the DOM
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
