<body>
  <script>
    // A reliable function to update the HubSpot React state using the native descriptor workaround
    function injectPlidToHubSpotForm(formElement) {
      if (!formElement) return;

      const fieldName = 'temp_pio_plid';
      // Use wildcard to catch '0-1/temp_pio_plid' or any variations
      const plidField = formElement.querySelector(`input[name*="${fieldName}"]`);

      if (plidField && window.partnerLinkLibrary && typeof window.partnerLinkLibrary.getPlid === 'function') {
        const plidValue = window.partnerLinkLibrary.getPlid();

        // Force set the value bypassing React's internal value tracking setter override
        const nativeInputValueSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value").set;
        nativeInputValueSetter.call(plidField, plidValue);

        // Bubble the events up so HubSpot updates its internal state store
        plidField.dispatchEvent(new Event('input', { bubbles: true }));
        plidField.dispatchEvent(new Event('change', { bubbles: true }));

        console.log('[partner.io] PLID injected and state updated successfully:', plidValue);
        return true;
      }
      return false;
    }

    // 1. BACKUP: If the script loaded late and the form is already on the page, update it now
    const existingForm = document.querySelector('form');
    if (existingForm) {
      console.log('[partner.io] Form already present on execution, injecting value...');
      injectPlidToHubSpotForm(existingForm);
    }

    // 2. PRIMARY TRACKER: Use your MutationObserver to capture the form element the millisecond it injects into the DOM
    const observer = new MutationObserver(function (mutations, obs) {
      const form = document.querySelector('form');
      if (form) {
        console.log('[partner.io] Form detected in DOM via Observer');

        // Inject the PLID right away while the form is initializing
        injectPlidToHubSpotForm(form);

        // Attach your submission tracking listener
        console.log('[partner.io] Attaching sign-up tracking listener');
        form.addEventListener('submit', function (event) {
          console.log('[partner.io] Form submitted, recording sign-up event');
          const data = window.partnerLinkLibrary.getSignUpDataFromFormElement(form);
          window.partnerLinkLibrary.recordSignUpEvent(data);
        });

        obs.disconnect();
        console.log('[partner.io] Mutation observer disconnected successfully');
      }
    });

    // Start tracking the DOM transitions
    observer.observe(document.body, { childList: true, subtree: true }); 
  </script>
