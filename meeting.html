<!DOCTYPE html>
<html lang="en">

<head>
    <script src="https://widget.partner.io/partnerLink.js"></script>
<script>
  window.partnerLinkLibrary.init();
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner.io | Scale Your Business</title>
    <meta name="description"
        content="Join the partner network that helps you scale your business through referral tracking and automation.">
    <link rel="stylesheet" href="style.css">
    <!-- Tracking Script -->
    <script data-site-id="site_c0uydxbbmmevu485" src="https://www.measured.site/js/script.js"
        data-api-url="https://www.measured.site/api/session" defer></script>
</head>
<body>
<script src="https://js-eu1.hsforms.net/forms/embed/developer/145620171.js" defer></script>
<div class="hs-form-html" data-region="eu1" data-form-id="b5184a88-3119-4a08-abd4-6ee9acae9e31" data-portal-id="145620171"></div>
<script>
  function injectPlid(field) {
    if (window.partnerLinkLibrary && typeof window.partnerLinkLibrary.getPlid === 'function') {
      const plidValue = window.partnerLinkLibrary.getPlid();
      field.value = plidValue;
      field.dispatchEvent(new Event('input', { bubbles: true }));
      field.dispatchEvent(new Event('change', { bubbles: true }));
      console.log('[partner.io] PLID injected:', plidValue);
    } else {
      console.warn('[partner.io] getPlid not available');
    }
  }

  const observer = new MutationObserver(function(mutations, obs) {
    const form = document.querySelector('form');
    if (form) {
      console.log('[partner.io] Form found, attaching listeners:', form);
      obs.disconnect();

      // Watch for the hidden PLID field to appear inside the form
      const fieldObserver = new MutationObserver(function(_, fieldObs) {
        const plidField = form.querySelector('input[name*="temp_pio_plid"]');
        if (plidField) {
          fieldObs.disconnect();
          injectPlid(plidField);
        }
      });

      // Check immediately in case the field is already present
      const plidField = form.querySelector('input[name*="temp_pio_plid"]');
      if (plidField) {
        injectPlid(plidField);
      } else {
        fieldObserver.observe(form, { childList: true, subtree: true });
      }

      form.addEventListener('submit', function() {
        console.log('[partner.io] Form submitted, recording sign-up event');
        const data = window.partnerLinkLibrary.getSignUpDataFromFormElement(form);
        window.partnerLinkLibrary.recordSignUpEvent(data);
      });

      console.log('[partner.io] Listeners attached successfully');
    }
  });

  observer.observe(document.body, { childList: true, subtree: true });
</script>
</body>
